name: Build Fork Images

on:
  push:
    branches:
      - coolify-fork-deploy
  workflow_dispatch:

concurrency:
  group: build-fork-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  HUSKY: 0

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          BRANCH_LC="$(echo '${{ github.ref_name }}' | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_LC" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$BRANCH_LC-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build Budibase packages
        run: yarn build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUDIBASE_VERSION=${{ steps.meta.outputs.branch_tag }}
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/budibase-app:${{ steps.meta.outputs.branch_tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/budibase-app:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=budibase-app
          cache-to: type=gha,scope=budibase-app,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/worker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUDIBASE_VERSION=${{ steps.meta.outputs.branch_tag }}
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/budibase-worker:${{ steps.meta.outputs.branch_tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/budibase-worker:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=budibase-worker
          cache-to: type=gha,scope=budibase-worker,mode=max

      - name: Summary
        run: |
          echo "### Fork images pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${{ steps.meta.outputs.owner_lc }}/budibase-app:${{ steps.meta.outputs.branch_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${{ steps.meta.outputs.owner_lc }}/budibase-worker:${{ steps.meta.outputs.branch_tag }}" >> "$GITHUB_STEP_SUMMARY"
