services:
  app-service:
    image: ghcr.io/eikmoen/budibase-app:${BUDIBASE_IMAGE_TAG:-coolify-fork-deploy}
    pull_policy: always
    restart: unless-stopped
    environment:
      - SELF_HOSTED=1
      - COUCH_DB_URL=http://${COUCH_DB_USER}:${COUCH_DB_PASSWORD}@couchdb-service:5984
      - WORKER_URL=http://worker-service:4003
      - MINIO_URL=http://minio-service:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - BUDIBASE_ENVIRONMENT=${BUDIBASE_ENVIRONMENT:-PRODUCTION}
      - PORT=4002
      - API_ENCRYPTION_KEY=${API_ENCRYPTION_KEY}
      - ENCRYPTION_KEY=${API_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=info
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
      - REDIS_URL=redis-service:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - BB_ADMIN_USER_EMAIL=${BB_ADMIN_USER_EMAIL}
      - BB_ADMIN_USER_PASSWORD=${BB_ADMIN_USER_PASSWORD}
    depends_on:
      - worker-service
      - redis-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://localhost:4002/health"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s

  worker-service:
    image: ghcr.io/eikmoen/budibase-worker:${BUDIBASE_IMAGE_TAG:-coolify-fork-deploy}
    pull_policy: always
    restart: unless-stopped
    environment:
      - SELF_HOSTED=1
      - PORT=4003
      - CLUSTER_PORT=10000
      - API_ENCRYPTION_KEY=${API_ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_URL=http://minio-service:9000
      - APPS_URL=http://app-service:4002
      - COUCH_DB_USERNAME=${COUCH_DB_USER}
      - COUCH_DB_PASSWORD=${COUCH_DB_PASSWORD}
      - COUCH_DB_URL=http://${COUCH_DB_USER}:${COUCH_DB_PASSWORD}@couchdb-service:5984
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - REDIS_URL=redis-service:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis-service
      - minio-service
    healthcheck:
      test: ["CMD", "wget", "--spider", "-qO-", "http://localhost:4003/health"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s

  minio-service:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
      - MINIO_BROWSER=off
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 10

  proxy_service:
    image: budibase/proxy
    restart: unless-stopped
    environment:
      - SERVICE_URL_BUDIBASE_10000
      - PROXY_RATE_LIMIT_WEBHOOKS_PER_SECOND=10
      - PROXY_RATE_LIMIT_API_PER_SECOND=20
      - APPS_UPSTREAM_URL=http://app-service:4002
      - WORKER_UPSTREAM_URL=http://worker-service:4003
      - MINIO_UPSTREAM_URL=http://minio-service:9000
      - COUCHDB_UPSTREAM_URL=http://couchdb-service:5984
      - RESOLVER=127.0.0.11
    depends_on:
      - minio-service
      - worker-service
      - app-service
      - couchdb-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s

  couchdb-service:
    image: budibase/database:2.1.0
    restart: unless-stopped
    environment:
      - COUCHDB_PASSWORD=${COUCH_DB_PASSWORD}
      - COUCHDB_USER=${COUCH_DB_USER}
      - TARGETBUILD=docker-compose
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes:
      - couchdb3_data:/data

  redis-service:
    image: redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s

volumes:
  couchdb3_data:
  minio_data:
  redis_data:
